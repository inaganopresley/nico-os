[service]
rootDirectory = "/app"
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[build]
buildCommand = "pip install -r requirements.txt"
